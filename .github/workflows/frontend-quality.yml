name: Frontend quality

on:
  push:
    branches:
      - main
      - redesign/tailwind-no-login
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
